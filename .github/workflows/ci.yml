name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  check:
    name: check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.16.0'
      - name: Check publication inputs
        run: node scripts/check-publication.mjs
      - name: Scan Git history and source for secrets
        run: bash scripts/scan-secrets.sh
      - name: Install locked dependencies
        run: npm ci
      - name: Build and verify installation package
        run: npm run pack
      - name: Test final installation package
        run: npm test
      - name: Prepare release assets
        run: node scripts/prepare-release.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-${{ github.sha }}
          path: dist/release/
          if-no-files-found: error
          retention-days: 7
