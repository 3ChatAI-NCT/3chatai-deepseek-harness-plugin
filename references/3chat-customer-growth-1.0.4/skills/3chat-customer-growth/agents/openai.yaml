interface:
  display_name: "3Chat Customer Growth"
  short_description: "Find, understand, and engage customers with 3Chat"
  default_prompt: "Use $3chat-customer-growth to find high-intent customers, analyze recent conversations, and draft a follow-up message for confirmation."

dependencies:
  tools:
    - type: "mcp"
      value: "3chat-customer-growth"
      description: "Search and analyze 3Chat customer and group conversations, upload attachments, send confirmed messages, and track batch sends."
      transport: "streamable_http"
      url: "https://app.3chat.ai/mcp"

policy:
  allow_implicit_invocation: true
